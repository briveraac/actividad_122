<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Lo Quieres, Te Lo Vendo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <nav class="navbar navbar-dark menu">
    <div class="container">
      <a class="navbar-brand" href="index.html">Lo quieres, te lo vendo</a>
      <div>
        <a href="index.html">Inicio</a> |
        <a href="index.html#productos">Productos</a> |
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
  </nav>

  <h1 style="font-family: Arial; font-size: 10px;">Contáctanos</h1>

  <p class="extracto" style="font-size: 14px; line-height: 1.6; color: #333;">
    ¿Tienes dudas sobre un pedido o quieres cotizar un producto? Completa el formulario
    y te responderemos pronto.
  </p>

  <form class="container">
    <div class="mb-3">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
      <label for="correo">Correo electrónico</label>
      <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com">
    </div>
    <div class="mb-3">
      <label for="asunto">Asunto</label>
      <select class="form-select" id="asunto">
        <option>Consulta general</option>
        <option>Estado de un pedido</option>
        <option>Reclamo</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="mensaje">Mensaje</label>
      <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>
    </div>
    <button type="submit" class="btn boton-rojo">Enviar</button>
  </form>

  <footer class="pie">
    <p>Equipo Full Stack II - 2026</p>
  </footer>

</body>
</html>
